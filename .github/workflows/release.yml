name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install e2e dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync
          curl --fail --silent --show-error --location \
            --output /tmp/herdr \
            https://github.com/herdrdev/herdr/releases/download/v0.8.0/herdr-linux-x86_64
          echo "b872ea7e40fa2cb17e857ac9b62b1bf26db7b403c622f5d2f3f5b35f6e9acd28  /tmp/herdr" \
            | sha256sum --check
          sudo install -m 0755 /tmp/herdr /usr/local/bin/herdr
      - run: bun install --frozen-lockfile
      - run: bun run style
      - run: bunx tsc --noEmit
      - run: bun test

  image:
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.identity.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: images/coding/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/bipa-app/beam-coding:${{ github.ref_name }}
          build-args: BEAM_IMAGE_VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - name: Export immutable image identity
        id: identity
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image=ghcr.io/bipa-app/beam-coding@${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Verify managed providers can pull without registry credentials
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
        run: |
          docker logout ghcr.io
          docker pull "$IMAGE"

  build:
    needs: image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            asset: beam-darwin-arm64
          - target: bun-darwin-x64
            asset: beam-darwin-x64
          - target: bun-linux-arm64
            asset: beam-linux-arm64
          - target: bun-linux-x64
            asset: beam-linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Compile ${{ matrix.asset }}
        env:
          BEAM_CODING_IMAGE: ${{ needs.image.outputs.image }}
        run: >-
          bun build --compile --minify
          --define BEAM_RELEASE_CODING_IMAGE="'${BEAM_CODING_IMAGE}'"
          --target=${{ matrix.target }}
          --outfile=${{ matrix.asset }}
          src/cli.ts
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: beam-*
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum beam-* > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/beam-*
          dist/SHA256SUMS
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
