name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install e2e deps (tmux for the round-trip test)
        run: sudo apt-get update && sudo apt-get install -y tmux rsync
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
