name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install e2e deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y rsync
          curl -fsSL -o /tmp/herdr https://github.com/herdrdev/herdr/releases/download/v0.8.0/herdr-linux-x86_64
          sudo install -m 0755 /tmp/herdr /usr/local/bin/herdr
      - name: Install e2e deps (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL -o /tmp/herdr https://github.com/herdrdev/herdr/releases/download/v0.8.0/herdr-macos-aarch64
          sudo install -m 0755 /tmp/herdr /usr/local/bin/herdr
      - run: bun install --frozen-lockfile
      - run: bun run style
      - run: bunx tsc --noEmit
      - run: bun test
