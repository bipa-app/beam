[package]
name = "beam"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Hand off a live coding-agent session to a remote sandbox — and bring it back."
license = "MIT"
repository = "https://github.com/bipa-app/beam"
[dependencies]
# Allowlist (docs/DESIGN.md: Rust port (transition record)) — exact versions
# are pinned by the committed Cargo.lock.
hex = "0.4"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
syn = { version = "2", features = ["full", "visit", "parsing", "printing", "proc-macro"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
